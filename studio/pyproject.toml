[project]
name = "archdraw-studio"
version = "0.1.0"
description = "archdraw studio: projects of architecture diagrams on an infinite canvas"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "pyright>=1.1.380"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["server"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["server"]

[tool.pyright]
include = ["server"]
extraPaths = ["server"]
